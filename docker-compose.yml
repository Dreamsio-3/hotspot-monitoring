services:
  server:
    build:
      context: ./server
    env_file:
      - path: ./server/.env
        required: false
    environment:
      DATABASE_URL: file:/app/data/dev.db
      PORT: 3001
      CLIENT_URL: http://localhost:5173
    volumes:
      - server-data:/app/data
    ports:
      - "3001:3001"
    restart: unless-stopped

  client:
    build:
      context: ./client
    depends_on:
      - server
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  server-data:
